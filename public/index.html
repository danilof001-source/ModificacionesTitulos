<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificacion de Información de Títulos Extranjeros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container-fluid min-vh-100 d-flex flex-column justify-content-center align-items-center bg-light">
        
        <div id="login-card" class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
            <div class="card-body text-center">
                <h3 class="mb-4 text-primary">Modificacion de Información de Títulos Extranjeros</h3>
                <p class="text-muted">Ingrese sus credenciales</p>
                
                <form id="loginForm">
                    <div class="mb-3 text-start">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" required placeholder="Ej: admin">
                    </div>
                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" required placeholder="****">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
                    </div>
                </form>
                <div id="loginError" class="mt-3 text-danger d-none">
                    Usuario o contraseña incorrectos.
                </div>
            </div>
        </div>

        <div id="main-panel" class="d-none text-center w-100">
            <h2 class="mb-4">Bienvenido al Sistema</h2>
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                <button id="btnMatriz" class="btn btn-success btn-lg px-5">
                    Matriz de modificaciones
                    <input type="file" id="fileInput" accept=".xlsx, .xls" style="display: none;">
                </button>
            </div>
            <div id="statusArea" class="mt-4 container text-start"></div>
        </div>

    </div>

    <script src="js/logic.js"></script>
</body>
</html>
